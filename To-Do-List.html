<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List Application</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f0f4f8;
            color: #333;
            padding: 90px;
            transition: 0.3s;
        }

        .container {
            max-width: 850px;
            margin: 30px auto;
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        header h1 {
            color: #3156c9;
            margin-bottom: 10px;
        }

        header p {
            color: #666;
            margin-bottom: 15px;
        }

        button, input, select {
            font: inherit;
            padding: 11px;
            border-radius: 6px;
            border: 1px solid #ccc;
        }

        button {
            cursor: pointer;
            border: none;
            background: #3156c9;
            color: white;
        }

        button:hover {
            opacity: 0.85;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 25px;
        }

        .stat-box {
            background: #edf1ff;
            padding: 18px 10px;
            text-align: center;
            border-radius: 10px;
        }

        .stat-box h3 {
            color: #3156c9;
            font-size: 26px;
        }

        .stat-box p {
            margin-top: 5px;
            font-size: 14px;
        }

        #taskForm {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }

        #addBtn {
            grid-column: 1 / -1;
        }

        .search-filter {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        #search {
            flex: 1;
            min-width: 0;
        }

        #taskList {
            list-style: none;
        }

        .task {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 15px 10px;
            margin-bottom: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            overflow-wrap: anywhere;
        }

        .task-info {
            flex: 1;
            min-width: 0;
        }

        .task-info h3 {
            margin-bottom: 7px;
        }

        .task-info p {
            font-size: 13px;
            color: #666;
            margin-top: 5px;
        }

        .task.completed h3 {
            text-decoration: line-through;
            color: #888;
        }

        .task-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .edit-btn {
            background: #e5a323;
        }

        .delete-btn {
            background: #dc3545;
        }

        .complete-btn {
            background: #198754;
        }

        #emptyMessage {
            text-align: center;
            color: #777;
            padding: 20px;
        }

        body.dark {
            background: #151922;
            color: #eee;
        }

        body.dark .container {
            background: #242a35;
        }

        body.dark .stat-box {
            background: #343c4b;
        }

        body.dark .stat-box h3 {
            color: #9eafff;
        }

        body.dark input,
        body.dark select {
            background: #343c4b;
            color: white;
            border-color: #596273;
        }

        body.dark .task {
            border-color: #596273;
        }

        body.dark .task-info p,
        body.dark header p {
            color: #ccc;
        }

        @media (max-width: 600px) {
            .container {
                padding: 15px;
                margin: 10px auto;
            }

            #taskForm {
                grid-template-columns: 1fr;
            }

            #addBtn {
                grid-column: auto;
            }

            .search-filter {
                flex-direction: column;
            }

            .task {
                align-items: flex-start;
                flex-direction: column;
            }

            .stats {
                gap: 6px;
            }

            .stat-box {
                padding: 12px 5px;
            }

            .stat-box h3 {
                font-size: 22px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <header>
            <h1>My To-Do List</h1>
            <p>Organize your daily activities</p>
            <button id="themeBtn">🌙 Dark Mode</button>
        </header>

        <div class="stats">
            <div class="stat-box">
                <h3 id="total">0</h3>
                <p>Total Tasks</p>
            </div>

            <div class="stat-box">
                <h3 id="completed">0</h3>
                <p>Completed</p>
            </div>

            <div class="stat-box">
                <h3 id="pending">0</h3>
                <p>Pending</p>
            </div>
        </div>

        <form id="taskForm">
            <input type="text" id="taskInput"
                   placeholder="Enter a new task..."
                   maxlength="150" required>

            <select id="category">
                <option value="Personal">Personal</option>
                <option value="College">College</option>
                <option value="Work">Work</option>
                <option value="Other">Other</option>
            </select>

            <select id="priority">
                <option value="Low">Low Priority</option>
                <option value="Medium" selected>Medium Priority</option>
                <option value="High">High Priority</option>
            </select>

            <input type="date" id="dueDate">

            <button type="submit" id="addBtn">Add Task</button>
        </form>

        <div class="search-filter">
            <input type="text" id="search" placeholder="Search tasks...">

            <select id="filter">
                <option value="All">All Tasks</option>
                <option value="Pending">Pending</option>
                <option value="Completed">Completed</option>
            </select>
        </div>

        <ul id="taskList"></ul>

        <p id="emptyMessage">No tasks yet. Add your first task!</p>

    </div>

    <script>
        const taskForm = document.getElementById("taskForm");
        const taskInput = document.getElementById("taskInput");
        const category = document.getElementById("category");
        const priority = document.getElementById("priority");
        const dueDate = document.getElementById("dueDate");
        const taskList = document.getElementById("taskList");
        const search = document.getElementById("search");
        const filter = document.getElementById("filter");
        const emptyMessage = document.getElementById("emptyMessage");
        const addBtn = document.getElementById("addBtn");
        const themeBtn = document.getElementById("themeBtn");

        let tasks = [];
        let editId = null;

        try {
            const savedTasks = JSON.parse(localStorage.getItem("myTasks"));

            if (Array.isArray(savedTasks)) {
                tasks = savedTasks.filter(task =>
                    task &&
                    typeof task.id === "number" &&
                    typeof task.text === "string" &&
                    typeof task.completed === "boolean"
                );
            }
        } catch (error) {
            tasks = [];
        }

        function saveTasks() {
            localStorage.setItem("myTasks", JSON.stringify(tasks));
        }

        function renderTasks() {
            taskList.replaceChildren();

            const query = search.value.trim().toLowerCase();
            const status = filter.value;

            const filteredTasks = tasks.filter(task => {
                const matchesSearch =
                    task.text.toLowerCase().includes(query);

                const matchesStatus =
                    status === "All" ||
                    (status === "Completed" && task.completed) ||
                    (status === "Pending" && !task.completed);

                return matchesSearch && matchesStatus;
            });

            filteredTasks.forEach(task => {
                const li = document.createElement("li");
                li.className = "task";

                if (task.completed) {
                    li.classList.add("completed");
                }

                const info = document.createElement("div");
                info.className = "task-info";

                const title = document.createElement("h3");
                title.textContent = task.text;

                const details = document.createElement("p");
                details.textContent =
                    "Category: " + task.category +
                    " | Priority: " + task.priority +
                    " | Due: " + (task.dueDate || "Not set");

                const statusText = document.createElement("p");
                statusText.textContent = task.completed
                    ? "Status: Completed"
                    : "Status: Pending";

                info.append(title, details, statusText);

                const actions = document.createElement("div");
                actions.className = "task-actions";

                const completeBtn = document.createElement("button");
                completeBtn.className = "complete-btn";
                completeBtn.textContent = task.completed
                    ? "Undo"
                    : "Complete";

                completeBtn.addEventListener("click", () => {
                    task.completed = !task.completed;
                    saveTasks();
                    renderTasks();
                });

                const editBtn = document.createElement("button");
                editBtn.className = "edit-btn";
                editBtn.textContent = "Edit";

                editBtn.addEventListener("click", () => {
                    taskInput.value = task.text;
                    category.value = task.category;
                    priority.value = task.priority;
                    dueDate.value = task.dueDate || "";

                    editId = task.id;
                    addBtn.textContent = "Update Task";
                    taskInput.focus();
                });

                const deleteBtn = document.createElement("button");
                deleteBtn.className = "delete-btn";
                deleteBtn.textContent = "Delete";

                deleteBtn.addEventListener("click", () => {
                    tasks = tasks.filter(item => item.id !== task.id);

                    if (editId === task.id) {
                        resetForm();
                    }

                    saveTasks();
                    renderTasks();
                });

                actions.append(completeBtn, editBtn, deleteBtn);
                li.append(info, actions);
                taskList.appendChild(li);
            });

            document.getElementById("total").textContent = tasks.length;

            document.getElementById("completed").textContent =
                tasks.filter(task => task.completed).length;

            document.getElementById("pending").textContent =
                tasks.filter(task => !task.completed).length;

            emptyMessage.style.display =
                filteredTasks.length === 0 ? "block" : "none";

            emptyMessage.textContent =
                tasks.length > 0 && filteredTasks.length === 0
                    ? "No matching tasks found."
                    : "No tasks yet. Add your first task!";
        }

        function resetForm() {
            taskForm.reset();
            editId = null;
            addBtn.textContent = "Add Task";
        }

        taskForm.addEventListener("submit", event => {
            event.preventDefault();

            const text = taskInput.value.trim();

            if (!text) {
                alert("Please enter a task!");
                taskInput.focus();
                return;
            }

            if (editId !== null) {
                const task = tasks.find(item => item.id === editId);

                if (task) {
                    task.text = text;
                    task.category = category.value;
                    task.priority = priority.value;
                    task.dueDate = dueDate.value;
                }
            } else {
                tasks.push({
                    id: Date.now() + Math.random(),
                    text: text,
                    category: category.value,
                    priority: priority.value,
                    dueDate: dueDate.value,
                    completed: false
                });
            }

            saveTasks();
            resetForm();
            renderTasks();
        });

        search.addEventListener("input", renderTasks);
        filter.addEventListener("change", renderTasks);

        themeBtn.addEventListener("click", () => {
            document.body.classList.toggle("dark");

            const isDark = document.body.classList.contains("dark");

            themeBtn.textContent = isDark
                ? "☀️ Light Mode"
                : "🌙 Dark Mode";

            localStorage.setItem("darkMode", isDark);
        });

        if (localStorage.getItem("darkMode") === "true") {
            document.body.classList.add("dark");
            themeBtn.textContent = "☀️ Light Mode";
        }

        renderTasks();
    </script>

</body>
</html>
